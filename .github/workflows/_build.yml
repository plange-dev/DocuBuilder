# Gemeinsamer Bau für Stable und Nightly (wird von stable.yml und nightly.yml aufgerufen).
name: Bauen

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read
  actions: read   # nötig für SignPath

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version setzen
        run: python tools/version.py set ${{ inputs.version }} --channel ${{ inputs.channel }}
      - run: python -m pip install pyinstaller
      # Programmordner (für das Setup; keine sich selbst entpackende Datei → weniger Fehlalarme)
      # und portable Einzeldatei
      - name: Bauen
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name DocuBuilder --workpath build/onedir --version-file version_info.txt --icon assets/docubuilder.ico --add-data "assets/docubuilder.ico:assets" --add-data "assets/docubuilder.png:assets" docubuilder.py
          python -m PyInstaller --noconfirm --onefile --windowed --name DocuBuilder --workpath build/onefile --version-file version_info.txt --icon assets/docubuilder.ico --add-data "assets/docubuilder.ico:assets" --add-data "assets/docubuilder.png:assets" docubuilder.py

      - name: Unsignierte Dateien hochladen
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            dist/DocuBuilder.exe
            dist/DocuBuilder/DocuBuilder.exe

      # Signieren nur, wenn SignPath eingerichtet ist (Repository-Variable SIGNPATH_ORGANIZATION_ID gesetzt)
      - name: Mit SignPath signieren
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Signierte Dateien übernehmen und prüfen
        if: ${{ steps.sign.outcome == 'success' }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Filter *.zip -ErrorAction SilentlyContinue
          if ($zip) { Expand-Archive $zip.FullName -DestinationPath signed -Force }
          Copy-Item signed\DocuBuilder.exe dist\DocuBuilder.exe -Force
          Copy-Item signed\DocuBuilder\DocuBuilder.exe dist\DocuBuilder\DocuBuilder.exe -Force
          foreach ($f in "dist\DocuBuilder.exe", "dist\DocuBuilder\DocuBuilder.exe") {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "Signaturstatus ${f}: $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "Signatur ungültig: $f ($($sig.Status))" }
          }

      - name: Installationsprogramm bauen
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nicht gefunden" }
          & $iscc "/DAppVersion=${{ inputs.version }}" "/DAppChannel=${{ inputs.channel }}" installer\DocuBuilder.iss
          if ($LASTEXITCODE) { throw "Inno Setup fehlgeschlagen" }

      # Setup ebenfalls signieren (sonst blockiert z. B. Smart App Control das Update).
      # Nur, wenn dafür eine eigene Artifact Configuration hinterlegt ist
      # (Repository-Variable SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG, siehe CODE_SIGNING.md).
      - name: Setup für die Signierung vorbereiten
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory setup-unsigned | Out-Null
          Copy-Item "dist\DocuBuilder-Setup-${{ inputs.version }}.exe" setup-unsigned\DocuBuilder-Setup.exe

      - name: Unsigniertes Setup hochladen
        id: unsigned_setup
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: setup-unsigned/DocuBuilder-Setup.exe

      - name: Setup mit SignPath signieren
        id: sign_setup
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Signiertes Setup übernehmen und prüfen
        if: ${{ steps.sign_setup.outcome == 'success' }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed-setup -Filter *.zip -ErrorAction SilentlyContinue
          if ($zip) { Expand-Archive $zip.FullName -DestinationPath signed-setup -Force }
          $target = "dist\DocuBuilder-Setup-${{ inputs.version }}.exe"
          Copy-Item signed-setup\DocuBuilder-Setup.exe $target -Force
          $sig = Get-AuthenticodeSignature $target
          Write-Host "Signaturstatus Setup: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Signatur des Setups ungültig: $($sig.Status)" }

      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.exe.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version setzen
        run: python tools/version.py set ${{ inputs.version }} --channel ${{ inputs.channel }}
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller
      - name: Bauen
        run: python -m PyInstaller --onefile --windowed --name DocuBuilder --add-data "assets/docubuilder.png:assets" docubuilder.py
      - name: Prüfsumme erzeugen
        run: cd dist && sha256sum DocuBuilder > DocuBuilder.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/DocuBuilder
            dist/DocuBuilder.sha256
